<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖片對半切</title>
<style>
  :root{
    --bg:#f5f5f2; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66;
    --line:#dcdcd6; --accent:#2f6f5e; --accent-ink:#ffffff; --drop:#eaf2ef;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161716; --card:#1f201f; --ink:#ecece8; --muted:#9a9a94;
      --line:#34352f; --accent:#5fb39b; --accent-ink:#0d1a16; --drop:#1d2a26;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
  main{max-width:1000px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.6}
  .drop{border:2px dashed var(--line);border-radius:14px;background:var(--card);
    padding:36px 16px;text-align:center;cursor:pointer;transition:.15s}
  .drop.over{background:var(--drop);border-color:var(--accent)}
  .drop b{display:block;font-size:16px;margin-bottom:6px}
  .drop span{color:var(--muted);font-size:13px}
  .opts{display:flex;flex-wrap:wrap;gap:18px;margin:16px 2px;font-size:14px;color:var(--muted)}
  .opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .head .name{font-weight:600;word-break:break-all}
  .head .size{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
  .part{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
  .thumb{height:130px;display:flex;align-items:center;justify-content:center;
    background:repeating-conic-gradient(#8881 0 25%,transparent 0 50%) 50%/16px 16px;border-radius:6px;overflow:hidden}
  .thumb img{max-width:100%;max-height:100%}
  .part .fn{font-size:12px;word-break:break-all}
  .part .dim{font-size:11px;color:var(--muted)}
  button{font:inherit;font-size:13px;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink)}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .bar{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
</style>
</head>
<body>
<main>
  <h1>圖片對半切</h1>
  <p class="sub">水平切是用一條水平線把圖切成上下兩半（1 是上半、2 是下半）；垂直切是用一條垂直線切成左右兩半（1 是左半、2 是右半）。輸出可以選 PNG 或 JPG，可以一次放多張圖。</p>

  <div class="drop" id="drop">
    <b>把圖片拖到這裡，或點一下選擇檔案</b>
    <span>支援 JPG、PNG、WebP、GIF（第一格）等瀏覽器看得懂的格式</span>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>

  <div class="opts">
    <span>輸出格式：</span>
    <label><input type="radio" name="fmt" value="png" checked> PNG</label>
    <label><input type="radio" name="fmt" value="jpg"> JPG</label>
    <label id="qwrap" hidden>品質 <input type="range" id="q" min="50" max="100" value="92"> <b id="qv">92</b></label>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="sep"> 檔名與後綴之間加底線（例：photo_水平切1.png）</label>
  </div>

  <div id="list"></div>
  <div class="bar" id="allbar" hidden><button id="all">全部下載</button></div>
</main>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const list = document.getElementById('list');
const allbar = document.getElementById('allbar');
const sepBox = document.getElementById('sep');
const results = []; // {baseName, parts:[{suffix, blob}]}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { handle(e.target.files); fileInput.value=''; });
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handle(e.dataTransfer.files));
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) handle(files);
});

const qInput = document.getElementById('q');
const qWrap = document.getElementById('qwrap');
const qv = document.getElementById('qv');
const fmt = () => document.querySelector('input[name=fmt]:checked').value;
const listeners = []; // 格式或底線改變時更新畫面上的檔名
const refreshAll = () => listeners.forEach(f => f());
document.querySelectorAll('input[name=fmt]').forEach(r => r.addEventListener('change', () => {
  qWrap.hidden = fmt() !== 'jpg'; refreshAll();
}));
qInput.addEventListener('input', () => qv.textContent = qInput.value);
sepBox.addEventListener('change', refreshAll);

function fileName(base, suffix){
  return base + (sepBox.checked ? '_' : '') + suffix + '.' + fmt();
}

// 依照目前選的格式把切好的畫布轉成檔案；JPG 不支援透明，透明處補白色
function encode(canvas){
  if (fmt() === 'png') return new Promise(r => canvas.toBlob(r, 'image/png'));
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(canvas, 0, 0);
  return new Promise(r => c.toBlob(r, 'image/jpeg', qInput.value / 100));
}

async function handle(files){
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    try { await processFile(f); } catch(err){ alert(f.name + ' 無法讀取：' + err.message); }
  }
  allbar.hidden = results.length === 0;
}

function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('不是可讀取的圖片'));
    img.src = url;
  });
}

function crop(img, sx, sy, w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, sx, sy, w, h, 0, 0, w, h);
  return c;
}

async function processFile(file){
  const img = await loadImage(file);
  const W = img.naturalWidth, H = img.naturalHeight;
  const base = file.name.replace(/\.[^.]+$/, '');
  // 奇數像素時，多出來的 1 px 給第 2 半，確保兩半合起來剛好等於原圖
  const topH = Math.floor(H/2), botH = H - topH;
  const leftW = Math.floor(W/2), rightW = W - leftW;

  const specs = [
    {suffix:'水平切1', note:'上半', args:[0, 0, W, topH]},
    {suffix:'水平切2', note:'下半', args:[0, topH, W, botH]},
    {suffix:'垂直切1', note:'左半', args:[0, 0, leftW, H]},
    {suffix:'垂直切2', note:'右半', args:[leftW, 0, rightW, H]},
  ];
  const parts = [];
  for (const s of specs){
    const canvas = crop(img, ...s.args);
    parts.push({...s, canvas, w:s.args[2], h:s.args[3]});
  }
  const entry = {base, parts};
  results.push(entry);
  render(entry, W, H);
}

function render(entry, W, H){
  const box = document.createElement('div');
  box.className = 'item';
  box.innerHTML = `<div class="head"><div class="name"></div><button class="ghost">下載這張的 4 個檔案</button></div><div class="grid"></div>`;
  box.querySelector('.name').innerHTML = '';
  box.querySelector('.name').append(entry.base);
  const sz = document.createElement('span'); sz.className='size'; sz.textContent = `${W} × ${H}`;
  box.querySelector('.name').append(sz);
  box.querySelector('.head button').onclick = () => downloadMany([entry]);
  const grid = box.querySelector('.grid');
  for (const p of entry.parts){
    const el = document.createElement('div'); el.className = 'part';
    el.innerHTML = `<div class="thumb"></div><div class="fn"></div><div class="dim"></div><button>下載</button>`;
    p.canvas.style.maxWidth = '100%'; p.canvas.style.maxHeight = '100%';
    el.querySelector('.thumb').append(p.canvas);
    const fnEl = el.querySelector('.fn');
    const refreshName = () => fnEl.textContent = fileName(entry.base, p.suffix);
    refreshName(); listeners.push(refreshName);
    el.querySelector('.dim').textContent = `${p.note}　${p.w} × ${p.h}`;
    el.querySelector('button').onclick = async () => save(await encode(p.canvas), fileName(entry.base, p.suffix));
    grid.append(el);
  }
  list.append(box);
}

function save(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function downloadMany(entries){
  for (const e of entries)
    for (const p of e.parts){
      save(await encode(p.canvas), fileName(e.base, p.suffix));
      await new Promise(r => setTimeout(r, 350)); // 間隔一下，避免瀏覽器擋連續下載
    }
}
document.getElementById('all').onclick = () => downloadMany(results);
</script>
</body>
</html>
